# Collegeolo — pass the visitor's location (from collegeolo-geoip.conf) to the app. Read by server/src/routes/presence.js
proxy_set_header X-Geo-Country $geo_country_code;
proxy_set_header X-Geo-Country-Name $geo_country_name;
proxy_set_header X-Geo-Region $geo_region;
proxy_set_header X-Geo-City $geo_city;
proxy_set_header X-Geo-Lat $geo_lat;
proxy_set_header X-Geo-Lon $geo_lon;
