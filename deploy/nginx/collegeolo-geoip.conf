# Collegeolo — visitor location from the IP address (nginx GeoIP2 + DB-IP City Lite, CC BY 4.0, https://db-ip.com)
# Installed into /etc/nginx/conf.d/ by apply.sh only when the geoip2 module and the database are both present.
geoip2 /usr/share/GeoIP/dbip-city-lite.mmdb {
  auto_reload 24h;
  $geo_country_code source=$remote_addr country iso_code;
  $geo_country_name source=$remote_addr country names en;
  $geo_region       source=$remote_addr subdivisions 0 names en;
  $geo_city         source=$remote_addr city names en;
  $geo_lat          source=$remote_addr location latitude;
  $geo_lon          source=$remote_addr location longitude;
}
