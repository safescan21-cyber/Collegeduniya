# Collegeolo — web server settings for heavy traffic (http level, installed into /etc/nginx/conf.d/ by apply.sh)
# compress text responses (pages, scripts, JSON) — about 4-5x less data per visitor
gzip_vary on;
gzip_proxied any;
gzip_comp_level 5;
gzip_min_length 1024;
gzip_types text/plain text/css text/xml application/javascript application/json application/xml application/rss+xml image/svg+xml;

# the site's JS/CSS/fonts are kept in a disk cache, so they are served by nginx without asking the website at all,
# and files from older builds stay available for visitors who still have an older page open
proxy_cache_path /var/cache/nginx/collegeolo levels=1:2 keys_zone=colg_static:20m max_size=2g inactive=30d use_temp_path=off;

# fair-use limits per visitor address (generous, because many mobile users in India share one address)
limit_req_zone  $binary_remote_addr zone=colg_req:20m rate=40r/s;
limit_conn_zone $binary_remote_addr zone=colg_conn:20m;

# re-use connections to the website and API instead of opening a new one per request
upstream colg_web { server 127.0.0.1:3310; keepalive 64; }
upstream colg_api { server 127.0.0.1:4010; keepalive 64; }

# ---- page microcache: a finished page is kept for 60 s and shared by visitors who are NOT logged in, per language.
# Search engines and busy pages then cost one page build per minute instead of one per visitor. Logged-in visitors,
# private areas and language-switch links (?hl=) always get a fresh page.
proxy_cache_path /var/cache/nginx/collegeolo-pages levels=1:2 keys_zone=colg_pages:50m max_size=2g inactive=30m use_temp_path=off;
map $http_cookie $colg_auth { default 0; "~*sb-[^=;]*-auth-token" 1; }
map $request_uri $colg_private {
  default 0;
  "~^/(admin|dashboard|messages|login|auth|verify|owner|employer|post|resume|rewards|unsubscribe|offline)" 1;
  "~[?&]hl=" 1;
}
map $http_accept_language $colg_accept_lang { default en; "~^(?<colg_l>[a-zA-Z]{2})" $colg_l; }
map $cookie_ses_lang $colg_lang { "" $colg_accept_lang; default $cookie_ses_lang; }
