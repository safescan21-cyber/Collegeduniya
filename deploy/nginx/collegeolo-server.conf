# v4 · Collegeolo — included inside the https server block of www.collegeolo.com by apply.sh
limit_req  zone=colg_req burst=200 nodelay;
limit_conn colg_conn 200;
limit_req_status 429;
limit_conn_status 429;
keepalive_timeout 30s;

# build files never change (their names contain a hash): cache for a year in browsers and in nginx
location ^~ /_next/static/ {
  proxy_pass http://colg_web;
  proxy_http_version 1.1;
  proxy_set_header Connection "";
  proxy_set_header Host $host;
  proxy_cache colg_static;
  proxy_cache_valid 200 30d;
  proxy_cache_valid 404 5s;
  proxy_cache_use_stale error timeout updating http_500 http_502 http_503 http_504;
  proxy_cache_lock on;
  add_header Cache-Control "public, max-age=31536000, immutable" always;
  add_header X-Cache $upstream_cache_status always;
}
location ^~ /flags/ {
  proxy_pass http://colg_web;
  proxy_http_version 1.1;
  proxy_set_header Connection "";
  proxy_set_header Host $host;
  proxy_cache colg_static;
  proxy_cache_valid 200 7d;
  add_header Cache-Control "public, max-age=604800" always;
}
# admin data imports (UK Discover Uni zip ≈25 MB, CRICOS, spreadsheets): bigger uploads and more time, admin routes only
location ^~ /api/admin/import/ {
  proxy_pass http://colg_api;
  proxy_http_version 1.1;
  proxy_set_header Connection "";
  proxy_set_header Host $host;
  proxy_set_header X-Real-IP $remote_addr;
  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  proxy_set_header X-Forwarded-Proto $scheme;
  client_max_body_size 300M;
  client_body_timeout 300s;
  proxy_read_timeout 300s;
  proxy_send_timeout 300s;
}
# API calls on a kept-alive connection; slow AI answers get time to finish
location ^~ /api/ {
  proxy_pass http://colg_api;
  proxy_http_version 1.1;
  proxy_set_header Connection "";
  proxy_set_header Host $host;
  proxy_set_header X-Real-IP $remote_addr;
  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  proxy_set_header X-Forwarded-Proto $scheme;
  include /etc/nginx/snippets/collegeolo-geo-headers.conf;   # visitor city/region/country (empty file when GeoIP is off)
  proxy_read_timeout 120s;
  client_max_body_size 20M;
}

# pages (everything not matched above) — through the 60 s page microcache for visitors who are not logged in
location / {
  proxy_pass http://colg_web;
  proxy_http_version 1.1;
  proxy_set_header Connection "";
  proxy_set_header Host $host;
  proxy_set_header X-Real-IP $remote_addr;
  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  proxy_set_header X-Forwarded-Proto $scheme;
  proxy_set_header Accept-Encoding "";          # nginx compresses per visitor, so one cached copy fits everyone
  proxy_cache colg_pages;
  # full page loads and in-app navigations (RSC) are different answers for the same address — keep them apart
  proxy_cache_key "$scheme$host$request_uri|$colg_lang|$http_rsc|$http_next_router_prefetch|$http_next_router_segment_prefetch|$http_next_router_state_tree|$http_next_url";
  proxy_cache_bypass $colg_auth $colg_private;
  proxy_no_cache $colg_auth $colg_private;
  proxy_ignore_headers Cache-Control Expires Vary;   # Set-Cookie is NOT ignored: a response that sets a cookie is never cached
  proxy_cache_valid 200 60s;
  proxy_cache_valid 404 30s;
  proxy_cache_use_stale updating error timeout http_500 http_502 http_503 http_504;
  proxy_cache_background_update on;
  proxy_cache_lock on;
  add_header X-Cache $upstream_cache_status always;
}
